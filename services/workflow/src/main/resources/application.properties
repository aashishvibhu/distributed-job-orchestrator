spring.application.name=workflow

# --- PostgreSQL (workflow_engine database) ---
# Override via environment variables when running in Docker:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workflow_engine}
spring.datasource.username=${DB_USERNAME:workflow}
spring.datasource.password=${DB_PASSWORD:workflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
